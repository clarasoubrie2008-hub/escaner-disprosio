<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escáner de disprosio</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#14202b;--muted:#5b6b7a;--accent:#0a7c6a;--track:#dde4ea}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a22;--card:#17262f;--text:#e8eef2;--muted:#9fb0bd;--accent:#3ed1b8;--track:#2a3d49}}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px}h2{font-size:1.1rem;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.big{font-size:4rem;font-weight:700;color:var(--accent);line-height:1}
.bar{height:12px;background:var(--track);border-radius:6px;overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;background:var(--accent)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--track);font-size:.85rem}
a.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--track);color:var(--text);text-decoration:none}
a.row:last-child{border:0}a.row b{color:var(--accent)}
.btn{display:inline-block;margin-top:10px;color:var(--accent)}
small{color:var(--muted)}
.qrs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qrs .card{text-align:center;background:#fff;color:#000;break-inside:avoid}
.qrs .q{display:flex;justify-content:center}
@media print{body{background:#fff}}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
var D=[2.1,3.0,3.8,4.5,5.5,6.2,7.4,8.9];
function level(p){return p<3?"Bajo":p<6?"Medio":"Alto"}
function fmt(p){return p.toFixed(1).replace(".",",")}
function home(){
  var h='<h1>Escáner de disprosio</h1><p class="sub">Estación 2 · Identify</p>'+
  '<div class="card"><h2>¿Qué es el disprosio (Dy)?</h2><p>Es una tierra rara pesada que se agrega a los imanes de neodimio (NdFeB) para que no pierdan fuerza a altas temperaturas. Por eso está en motores de autos eléctricos, turbinas eólicas y robots.</p><p>Un imán comercial suele tener entre 1% y 10% de disprosio en peso (en algunos casos hasta 12%). Es escaso y caro, por eso reciclarlo es estratégico.</p></div>'+
  '<div class="card"><h2>Muestras analizadas</h2>';
  D.forEach(function(p,i){h+='<a class="row" href="#iman-'+(i+1)+'"><span>Imán #'+(i+1)+'</span><b>'+fmt(p)+'% Dy</b></a>'});
  return h+'</div>';
}
function result(n){
  var p=D[n-1];
  return '<h1>Resultado del escaneo</h1><p class="sub">Imán #'+n+' · análisis completado</p>'+
  '<div class="card"><div class="sub" style="margin:0">Contenido de disprosio</div><div class="big">'+fmt(p)+'%</div>'+
  '<div class="bar"><i style="width:'+(p/12*100)+'%"></i></div><small>Escala de 0% a 12% (máximo en imanes comerciales)</small>'+
  '<p><span class="tag">Nivel: '+level(p)+'</span></p>'+
  '<p>Material apto para pasar a la Estación 3 (Process).</p></div>'+
  '<a class="btn" href="#">Ver información sobre el disprosio</a>';
}
function qrs(){
  var base=location.href.split("#")[0];
  var h='<h1>Hoja de códigos QR</h1><p class="sub">Cada QR abre el resultado de su imán. Imprimila o sacale captura.</p><div class="qrs">';
  D.forEach(function(p,i){h+='<div class="card"><div class="q" id="q'+(i+1)+'"></div><b>Imán #'+(i+1)+'</b></div>'});
  document.getElementById("app").innerHTML=h+'</div><p><small>Dirección base: '+base+'</small></p>';
  D.forEach(function(p,i){new QRCode(document.getElementById("q"+(i+1)),{text:base+"#iman-"+(i+1),width:220,height:220,correctLevel:QRCode.CorrectLevel.M})});
}
function render(){
  var m=/^#iman-([1-8])$/.exec(location.hash);
  if(location.hash==="#qrs"){qrs();return}
  document.getElementById("app").innerHTML=m?result(+m[1]):home();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);render();
</script>
</body>
</html>
